name: Compile the app and run tests

on:
  push:
    branches-ignore:
      - main
      - dev

# A newer push to the same branch supersedes the running check; without this
# every follow-up push stacks another 19-29 minute test job behind the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    # A wedged run must fail visibly, not sit on the runner for the 6h default.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check --output-format=github .

      - name: Build app
        run: python -m compileall api core database services scripts web_server.py wsgi.py beatport_unified_scraper.py

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -n auto

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: webui

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Matches the Dockerfile's node:24-slim webui-builder stage
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Build webui
        run: npm run build

      - name: Run tests
        run: npm test

  webui-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking for now: UI changes land on dev without re-rendered
    # baselines, so a diff here is a heads-up, not a red run. The diffs are
    # still uploaded. Refresh the baselines with the visual-baselines
    # workflow (see webui/tests/visual/README.md).
    continue-on-error: true
    # The baselines are rendered in this image (webui/scripts/visual.mjs runs
    # them in it locally too), so fonts and rasterising match. Keep the tag in
    # step with @playwright/test in webui/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --ipc=host

    defaults:
      run:
        working-directory: webui

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Build webui
        run: npm run build

      - name: Compare screenshot baselines
        run: node scripts/visual.mjs

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: webui/test-results
          retention-days: 7
