name: Publish foundation image
on:
  push:
    branches: [library-overhaul]
  workflow_dispatch:
concurrency:
  group: foundation-image
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/nick2000713/soulsync:foundation
jobs:
  publish:
    if: github.repository == 'nick2000713/SoulSync'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Unraid image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=foundation
          cache-to: type=gha,mode=max,scope=foundation
      - name: Verify compilation and Library regressions in the image
        run: >-
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c
          'python -m compileall -q api core database services web_server.py wsgi.py &&
          python -m pip install --no-cache-dir pytest==9.0.3 pytest-timeout==2.4.0 &&
          python -m pytest tests/library2/test_metadata_consistency.py
          tests/wishlist/test_library_monitoring_consistency.py -q --tb=short'
      - name: Publish verified image
        run: |
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE"
