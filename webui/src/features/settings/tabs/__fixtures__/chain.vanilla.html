                                    <!-- Download Settings -->
                                    <!-- Source Settings is always open. It is the main event on this
                                 tab - the download chain, the source pool and the stream /
                                 concurrency settings - so putting it behind a click only hid
                                 the thing people came here for. Static heading, no arrow, no
                                 toggle; the body carries no .collapsed class, which is what
                                 switchSettingsTab keys off when it re-hides bodies. -->
                                    <div class="settings-section-header settings-section-static" data-stg="downloads">
                                        <h3>Source Settings</h3>
                                        <span class="settings-section-hint">Source, stream &amp; concurrency</span>
                                    </div>
                                    <div class="settings-section-body" data-stg="downloads">
                                        <div class="settings-group source-settings-wrapper" data-stg="downloads">

                                            <div class="settings-subcard">
                                                <!-- The chain widget below IS this setting now: one source in the
                                     chain means "<that source> only", two or more means hybrid. The
                                     select stays because saveSettings reads it to persist
                                     download_source.mode and updateDownloadSourceUI reads it back —
                                     it is the transport, not a control, so it is hidden rather than
                                     deleted. Two controls for one setting is how they drift. -->
                                                <div class="form-group" hidden>
                                                    <label>Download Source:</label>
                                                    <select id="download-source-mode" class="form-select"
                                                        onchange="updateDownloadSourceUI()">
                                                        <option value="soulseek">Soulseek Only</option>
                                                        <option value="youtube">YouTube Only</option>
                                                        <option value="tidal">Tidal Only</option>
                                                        <option value="qobuz">Qobuz Only</option>
                                                        <option value="hifi">HiFi Only (Free Lossless)</option>
                                                        <option value="deezer_dl">Deezer Only</option>
                                                        <option value="lidarr">Lidarr Only</option>
                                                        <option value="soundcloud">SoundCloud Only</option>
                                                        <option value="torrent">Torrent Only (via Prowlarr)</option>
                                                        <option value="usenet">Usenet Only (via Prowlarr)</option>
                                                        <option value="hybrid">Hybrid (Primary + Fallback)</option>
                                                    </select>
                                                    <span class="info-icon" role="button" tabindex="0"
                                                        title="What's this?" onclick="toggleSettingHelp(this)"
                                                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSettingHelp(this);}">i</span>
                                                    <div class="setting-help-text setting-help-body" hidden>
                                                        Choose where to download music from. Hybrid mode tries primary
                                                        source first,
                                                        then falls back to secondary if it fails.
                                                    </div>
                                                </div>





                                                <!-- ═══ DOWNLOAD CHAINS ═════════════════════════════════════
                                     One widget for all three media types. Music, video and
                                     audiobooks each keep their own {mode, hybrid_order} —
                                     the same shape in three places — and used to have three
                                     separate editors that looked and behaved differently.
                                ═════════════════════════════════════════════════════════ -->
                                                <div id="download-chain-widget">
                                                    <div class="dlchain-tabs" id="dlchain-tabs" role="tablist"></div>
                                                    <div class="setting-help-text" id="dlchain-help"></div>
                                                    <div class="dlchain-columns">
                                                        <div class="dlchain-col">
                                                            <div class="dlchain-col-head">
                                                                <span class="dlchain-col-label">Available</span>
                                                                <span class="dlchain-col-hint">drag one across, or click it</span>
                                                                <input type="search" id="dlchain-filter"
                                                                    class="dlchain-filter" placeholder="Filter"
                                                                    aria-label="Filter available sources"
                                                                    oninput="dlchainFilter(this.value)"
                                                                    autocomplete="off">
                                                            </div>
                                                            <div class="dlchain-pool" id="dlchain-pool"></div>

                                                        </div>
                                                        <div class="dlchain-col">
                                                            <div class="dlchain-col-head">
                                                                <span class="dlchain-col-label">Download chain</span>
                                                                <span class="dlchain-col-hint"
                                                                    id="dlchain-mode-hint"></span>
                                                            </div>
                                                            <div class="dlchain-list" id="dlchain-list"></div>
                                                        </div>
                                                    </div>


                                                </div>

                                                <!-- Hybrid Mode Settings (shown only when hybrid is selected) -->
                                                <div id="hybrid-settings-container" style="display: none;">
                                                    <div class="hybrid-source-list" id="hybrid-source-list" hidden>
                                                        <!-- Legacy music list. The chain widget above replaced it;
                                             kept (hidden) because buildHybridSourceList still owns
                                             the per-source status probing the Sources tiles read. -->
                                                    </div>
                                                    <!-- Hidden selects for backward compatibility with saveSettings -->
                                                    <select id="hybrid-primary-source" style="display:none;">
                                                        <option value="soulseek">Soulseek</option>
                                                        <option value="youtube">YouTube</option>
                                                        <option value="tidal">Tidal</option>
                                                        <option value="qobuz">Qobuz</option>
                                                        <option value="hifi">HiFi</option>
                                                        <option value="deezer_dl">Deezer</option>
                                                        <option value="soundcloud">SoundCloud</option>
                                                    </select>
                                                    <select id="hybrid-secondary-source" style="display:none;">
                                                        <option value="soulseek">Soulseek</option>
                                                        <option value="youtube">YouTube</option>
                                                        <option value="tidal">Tidal</option>
                                                        <option value="qobuz">Qobuz</option>
                                                        <option value="hifi">HiFi</option>
                                                        <option value="deezer_dl">Deezer</option>
                                                        <option value="soundcloud">SoundCloud</option>
                                                    </select>
                                                </div>
                                            </div><!-- end basic source subcard -->

                                        </div>
                                    </div><!-- end Download Settings body -->
