<div class="qp-profile-list" id="qp-profile-list">
  <div class="qp-profile-row active">
    <span class="qp-profile-dot" title="Currently the active default"></span
    ><span
      class="qp-profile-text"
      title="View this profile's settings (it's already the active default)"
      ><span class="qp-profile-name">Balanced</span
      ><span class="qp-profile-sub"
        >FLAC 24-bit +2 more · deep verify · upgrade until FLAC</span
      ></span
    ><span class="qp-profile-tags"
      ><span
        class="qp-profile-tag qp-tag-default"
        title="Used by normal downloads and Wishlist items right now"
        >Downloads</span
      ></span
    ><span class="qp-profile-actions"
      ><button
        type="button"
        class="qp-profile-action qp-action-autoimport"
        title="Use 'Balanced' for Auto-Import"
      >
        ⇩</button
      ><button type="button" class="qp-profile-action qp-action-rename" title="Rename 'Balanced'">
        ✏</button
      ><button
        type="button"
        class="qp-profile-action qp-action-update"
        title="Save the current Quality-page settings to 'Balanced' now"
      >
        ✎</button
      ><button type="button" class="qp-profile-action qp-action-delete" title="Delete 'Balanced'">
        ×
      </button></span
    >
  </div>
  <div class="qp-profile-row editing">
    <span
      class="qp-profile-dot"
      title="Set 'Strict' as the active default (applies immediately, incl. anything downloading right now)"
    ></span
    ><span class="qp-profile-text" title="View/edit 'Strict's settings — does not activate it"
      ><span class="qp-profile-name">Strict</span
      ><span class="qp-profile-sub"
        >FLAC · strict AcoustID · lossless + OPUS companion · upgrades off</span
      ></span
    ><span class="qp-profile-tags"
      ><span
        class="qp-profile-tag qp-tag-autoimport"
        title="Also used by Auto-Import (Settings → Import)"
        >Auto-Import</span
      ></span
    ><span class="qp-profile-actions"
      ><button
        type="button"
        class="qp-profile-action qp-action-autoimport active"
        title="Stop using 'Strict' for Auto-Import (revert to the default profile)"
      >
        ⇩</button
      ><button type="button" class="qp-profile-action qp-action-rename" title="Rename 'Strict'">
        ✏</button
      ><button
        type="button"
        class="qp-profile-action qp-action-update"
        title="Save the current Quality-page settings to 'Strict' now"
      >
        ✎</button
      ><button type="button" class="qp-profile-action qp-action-delete" title="Delete 'Strict'">
        ×
      </button></span
    >
  </div>
</div>
