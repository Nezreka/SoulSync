<div
  id="source-config-modal"
  class="src-modal-overlay"
  hidden
  onclick="if (event.target === this) closeSourceModal();"
>
  <div class="src-modal" role="dialog" aria-modal="true" aria-labelledby="src-modal-title">
    <div class="src-modal-header">
      <span class="src-modal-icon" id="src-modal-icon"></span>
      <div class="src-modal-titles">
        <h3 id="src-modal-title">Source</h3>
        <span class="src-modal-sub" id="src-modal-sub"></span>
      </div>
      <span class="src-modal-meta" id="src-modal-meta"></span>
      <button type="button" class="src-modal-test" id="src-modal-test">Test</button>
      <button type="button" class="src-modal-close" onclick="closeSourceModal()" aria-label="Close">
        &times;
      </button>
    </div>
    <div class="src-modal-result" id="src-modal-result" role="status" aria-live="polite"></div>
    <div class="src-modal-body" id="src-modal-body"></div>
  </div>
</div>
