# BREAKING CHANGE (v1.3+): Database volume mount changed from /app/database to /app/data
# If upgrading from a previous version, update your docker-compose.yml:
#   OLD: - soulsync_database:/app/database
#   NEW: - soulsync_database:/app/data
# Your data will be preserved - it's the same volume, just mounted at a different path.

services:
  soulsync:
    image: boulderbadgedad/soulsync:latest
    container_name: soulsync-webui
    environment:
      # User/Group ID configuration
      - PUID=1000
      - PGID=1000
      - UMASK=022
      # Web server configuration
      - PYTHONPATH=/app
      # Optional: ONLY when your reverse proxy hosts SoulSync under a subpath,
      # e.g. https://media.example.com/soulsync/. Leave commented for normal setups.
      # Configure the proxy for the same path; see docs/REVERSE_PROXY_SUBPATH.md.
      # After changing this setting, recreate the container to apply it.
      # - SOULSYNC_URL_BASE=/soulsync
      # Optional: Configure through environment variables
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
      # Set timezone (change to your timezone)
      - TZ=America/New_York
      # OAuth callback ports. If 8888/8889 conflict with another container (e.g. Gluetun),
      # change the port numbers below AND update the matching port mappings in the ports section.
      # Then update the redirect URI in SoulSync → Settings → Connections AND in your Spotify/Tidal developer dashboard to match.
      - SOULSYNC_SPOTIFY_CALLBACK_PORT=8888
      - SOULSYNC_TIDAL_CALLBACK_PORT=8889
    ports:
      - "8008:8008"   # Main web app
      - "8888:8888"   # Spotify OAuth callback — keep in sync with SOULSYNC_SPOTIFY_CALLBACK_PORT above
      - "8889:8889"   # Tidal OAuth callback   — keep in sync with SOULSYNC_TIDAL_CALLBACK_PORT above
    volumes:
      # Persistent data volumes
      - ./config:/app/config
      - ./logs:/app/logs
      # Shared INPUT folder — slskd / torrent / usenet drop downloads here, and BOTH
      # the music and video sides read from it (Settings → Downloads uses one path).
      - ./downloads:/app/downloads
      # ─── Music library (OUTPUT) — REQUIRED: uncomment + set your path ────
      # The app needs a Transfer folder — where finished, organised music is moved
      # to for Plex / Jellyfin / Navidrome to read. UNCOMMENT the line below, point
      # the host side (left of the colon) at your music library, then set
      # Settings → Downloads → Transfer to /app/Transfer (matches the in-app
      
      # ./Transfer placeholder). Left commented so it never clashes with a Transfer
      # mount you already added in a previous setup — if you have one, keep it.

      # - ./Transfer:/app/Transfer

      # ─── Podcast library (OUTPUT) — optional: uncomment + set your path ───
      # Downloaded podcast episodes are saved here. UNCOMMENT the line below, point
      # the host side (left of the colon) at your podcasts folder, then set
      # Settings → Library → Podcasts Folder to /app/podcasts:
      # - ./podcasts:/app/podcasts
      # ─── Audiobook library (OUTPUT) — optional: uncomment + set your path ───
      # Finished audiobooks are filed here as Author/Series/Book folders. UNCOMMENT
      # the line below, point the host side (left of the colon) at your audiobook
      # folder, then set Settings → Library → Audiobooks Folder to /app/audiobooks.
      # Keep this OUT of your music library: a book is a folder of chapter files,
      # and a music scanner will happily index it as an album of 300 tracks.
      # - ./audiobooks:/app/audiobooks

      - ./Staging:/app/Staging
      - ./MusicVideos:/app/MusicVideos
      - ./scripts:/app/scripts
      # ─── Video libraries (OUTPUT) — one per content type ─────────────────
      # The video Downloads tab sorts finished files into these by type. Point each
      # at where Plex/Jellyfin reads from, then set the matching path on
      # Settings → Library → Folders → Videos (container paths):
      #   Movies → /media/movies   ·   TV → /media/tv   ·   YouTube → /media/youtube
      - ./Movies:/media/movies
      - ./TV:/media/tv
      - ./YouTube:/media/youtube
      # Multiple movie / TV drives: give EVERY mount a UNIQUE container path.
      # Mounts do not merge: do NOT bind several drives to /media/movies or /media/tv.
      # Replace the host paths below with your real folders, then uncomment:
      # - /mnt/drive2/Movies:/media/movies2:rw
      # - /mnt/drive3/Movies:/media/movies3:rw
      # - /mnt/drive4/Movies:/media/movies4:rw
      # - /mnt/drive2/TV:/media/tv2:rw
      # - /mnt/drive3/TV:/media/tv3:rw
      # - /mnt/drive4/TV:/media/tv4:rw
      # Recreate the container after adding mounts. In Settings → Library →
      # Folders → Videos, add /media/movies2, /media/movies3, /media/movies4 under
      # Additional Movie Libraries, and the /media/tv2 etc. paths under Additional
      # TV Libraries. Enter CONTAINER paths (right side), not /mnt/drive2 paths.
      # Keep /media/movies and /media/tv as primary destinations for new downloads.
      # Extra paths let SoulSync locate existing files for playback, upgrades,
      # renaming and recycling; :rw permits those file operations.
      # Plex/Jellyfin must also have these folders mounted and included in the
      # libraries selected for SoulSync's video scan. Adding paths here does not
      # create media-server libraries or directly crawl unindexed video folders.
      # Use named volume for database persistence (separate from host database)
      # NOTE: Changed from /app/database to /app/data to avoid overwriting Python package
      # Holds BOTH databases (music_library.db + video_library.db) plus the video
      # poster-asset store — watchlists/collections/overlays/issues/download-ledger
      # all persist here across container upgrades.
      - soulsync_database:/app/data
      # IMPORTANT: Mount host paths that your input/output folders live on.
      # Replace these examples with your actual paths:
      #   Linux/Mac:  - /path/to/your/downloads:/host/downloads:rw
      #   WSL:        - /mnt/d/Music:/host/music:rw
      # You can add as many mounts as needed for your setup.
      # - /path/to/downloads:/host/downloads:rw
      # - /path/to/music-library:/host/music:rw
      # Optional: Mount your music library for Plex/Jellyfin/Navidrome access
      # - /path/to/your/music:/music:ro
      #
      # ─── Torrent / Usenet download sources (Prowlarr integration) ────────
      # If you use the Torrent Only or Usenet Only download sources, SoulSync
      # needs to read the files your torrent / usenet client downloads.
      #
      # EASIEST SETUP: point qBittorrent, SABnzbd / NZBGet, AND slskd at the
      # SAME download folder. The ./downloads mount above is reused; nothing
      # new to add here. Just configure each client's download path to
      # /downloads (inside its own container) — files land in the same place
      # SoulSync already reads from.
      #
      # SEPARATE FOLDERS (if you prefer): uncomment + edit these to point at
      # the client's download folder. The in-container path must MATCH the
      # save_path the client reports.
      # - /path/to/qbittorrent/downloads:/downloads/torrents:rw
      # - /path/to/sabnzbd/complete:/downloads/usenet:rw
      # Then set the torrent client's save path to /downloads/torrents and
      # SAB / NZBGet's complete folder to /downloads/usenet (or whatever
      # in-container path you chose). Skip these if your downloader runs
      # outside Docker and writes to a path already mounted above.
    extra_hosts:
      # Allow container to reach host services
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8008/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ## ─── Optional: slskd (Soulseek client) ───────────────────────────────
  ## Uncomment below to run slskd alongside SoulSync.
  ## Downloads land in ./downloads which SoulSync already reads from.
  ## After starting, set your SoulSync slskd URL to http://slskd:5030
  ## and the API key to whatever you set in SLSKD_API_KEY below.
  #
  # slskd:
  #   image: slskd/slskd:latest
  #   container_name: slskd
  #   environment:
  #     - SLSKD_REMOTE_CONFIGURATION=true
  #     - SLSKD_API_KEY=your-api-key-here
  #     - TZ=America/New_York
  #   ports:
  #     - "5030:5030"
  #   volumes:
  #     - ./slskd-data:/app
  #     - ./downloads:/app/downloads
  #   restart: unless-stopped

# Named volumes for persistent data
volumes:
  soulsync_database:
    driver: local

# Optional: Add external network for communication with other containers
networks:
  default:
    name: soulsync-network
